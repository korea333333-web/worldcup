<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 World Cup Command Center</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <p class="eyebrow">FIFA World Cup 2026</p>
          <h1>World Cup Command Center</h1>
          <p class="subhead">
            경기, 인터뷰, 개막식, 하이라이트, 팀 분석을 한 화면에서 보는 월드컵 운영 허브입니다.
          </p>
        </div>
        <button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="mobileQuickNav">
          빠른 이동
        </button>
        <div class="summary-strip" id="summaryStrip" aria-label="대회 요약"></div>
      </header>

      <nav id="mobileQuickNav" class="mobile-quick-nav" aria-label="모바일 빠른 이동"></nav>

      <section id="matchHero" class="match-hero" aria-label="오늘의 대표 카드"></section>

      <nav class="tabs" aria-label="주요 보기">
        <button class="tab is-active" data-tab="groups" type="button">조별 현황</button>
        <button class="tab" data-tab="teams" type="button">팀 탐색</button>
        <button class="tab" data-tab="players" type="button">선수 정보</button>
        <button class="tab" data-tab="schedule" type="button">경기 일정</button>
        <button class="tab" data-tab="ceremony" type="button">개막식</button>
        <button class="tab" data-tab="stats" type="button">스탯 센터</button>
        <button class="tab" data-tab="matchups" type="button">빅매치</button>
        <button class="tab" data-tab="bracket" type="button">토너먼트</button>
        <button class="tab" data-tab="sources" type="button">출처</button>
      </nav>

      <section class="toolbar" aria-label="검색과 필터">
        <label class="search-box">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="팀, 선수, 조, 경기 검색" />
        </label>
        <label class="select-box">
          <span>상태</span>
          <select id="statusFilter" aria-label="진출 상태">
            <option value="all">전체 상태</option>
            <option value="Top 2">Top 2</option>
            <option value="3rd race">3위 경쟁</option>
            <option value="At risk">위험</option>
          </select>
        </label>
      </section>

      <section id="groupsView" class="view is-active"></section>
      <section id="teamsView" class="view"></section>
      <section id="playersView" class="view"></section>
      <section id="scheduleView" class="view"></section>
      <section id="ceremonyView" class="view"></section>
      <section id="statsView" class="view"></section>
      <section id="matchupsView" class="view"></section>
      <section id="bracketView" class="view"></section>
      <section id="sourcesView" class="view"></section>
    </main>

    <dialog id="teamDialog" class="team-dialog"></dialog>

    <script src="./data.js"></script>
    <script src="./rich-data.js"></script>
    <script src="./schedule-data.js"></script>
    <script src="./daily-data.js"></script>
    <script src="./hub-data.js"></script>
    <script src="./video-utils.js"></script>
    <script src="./group-utils.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
